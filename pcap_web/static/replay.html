<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>STRATUS - Relecture mission</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link id="favicon" rel="icon" href="static/favicon.ico">
<link rel="stylesheet" href="static/leaflet.css">
<link rel="stylesheet" href="static/style.css">
<link rel="stylesheet" href="static/pages.css">
<link rel="stylesheet" href="static/replay.css">
</head>
<body class="operator" data-page="replay">
<!-- Page OPÉRATEUR : carte + vidéo synchronisée + barre de temps. Même moteur que la console (app.js) ;
     les éléments d'analyse absents de cette page sont remplacés par des éléments détachés (voir $ dans app.js).
     Lancement par URL : replay?mission=NOM[&live=1]  ·  replay?pcap=/chemin/fichier.pcap[&live=1]  [&profile=maritime] -->
<div id="op">
  <header id="op-bar">
    <button id="stx-burger" class="stx-burger" aria-label="Menu" aria-expanded="false" title="menu StratusServer"><span></span><span></span><span></span></button>
    <img src="static/stratus.png" alt="" class="op-logo">
    <span class="sb-state stopped" id="sb-state">■ arrêt</span>
    <b id="op-mission" title="mission">—</b>
    <span class="spacer"></span>
    <button id="btn-play" class="accent" title="lire / suivre">▶ Lire</button>
    <button id="btn-pause" title="pause / reprise (espace)" disabled>⏸</button>
    <button id="btn-edge" class="accent" hidden title="revenir au direct (L)">⟫ Direct</button>
    <button id="btn-stop" class="danger" title="arrêter">■</button>
    <button id="btn-clip" title="extraire un clip (.ts) entre deux instants">✂ Clip</button>
    <button id="btn-snap" title="capture SNAP : image + métadonnées à l'instant courant → PNG + slide PowerPoint (S ou Ctrl+Shift+C)">📸 Snap</button>
    <select id="speed" title="vitesse de lecture">
      <option value="1">×1</option><option value="2">×2</option><option value="4">×4</option><option value="8">×8</option>
    </select>
    <span class="spacer"></span>
    <span id="op-clock" class="mono muted" title="heure UTC courante">—</span>
    <button id="op-swap" title="inverser carte / vidéo">⇆</button>
    <button id="op-full" title="plein écran (F)">⛶</button>
  </header>

  <div id="clip-panel" hidden>
    <div class="cp-row">
      <span class="cp-title" title="créneau UTC (GDH) · copie du TS capturé, sans ré-encodage">✂ Clip</span>
      <label>début <input id="clip-start" placeholder="HH:MM:SS" maxlength="8" autocomplete="off"><span class="z">Z</span></label>
      <button id="clip-start-cur" title="placer le début à la souris sur la barre de temps (Échap pour annuler)">📍</button>
      <label>fin <input id="clip-end" placeholder="HH:MM:SS" maxlength="8" autocomplete="off"><span class="z">Z</span></label>
      <button id="clip-end-cur" title="placer la fin à la souris sur la barre de temps (Échap pour annuler)">📍</button>
      <span class="cp-dur">durée <b id="clip-dur">—</b></span>
      <label class="chk" title="conserver le PID KLV (STANAG 4609) dans le .ts et écrire le CSV des positions"><input type="checkbox" id="clip-meta" checked> KLV</label>
      <span class="spacer"></span>
      <span id="clip-msg" class="muted"></span>
      <button id="clip-go" class="accent" disabled>✂ Extraire</button>
      <button id="clip-close">Fermer</button>
    </div>
  </div>
  <div id="snap-menu" hidden>
    <div class="cm-title" id="sm-title"></div>
    <button data-act="png">⬇ Image (.png)</button>
    <button data-act="agent">▣ Insérer dans le PowerPoint du poste</button>
  </div>
  <div id="video-menu" hidden>
    <div class="cm-title" id="vm-title"></div>
    <button data-act="mgrs">📋 Copier les coordonnées (MGRS)</button>
    <button data-act="ll">📋 Copier lat / lon (WGS84)</button>
    <button data-act="meas">📏 Mesurer un cap / distance</button>
    <button data-act="meas-clear">✕ Effacer la mesure vidéo</button>
  </div>
  <div id="clip-menu" hidden>
    <div class="cm-title" id="cm-title"></div>
    <button data-act="seek">▶ Aller au début</button>
    <button data-act="ts">⬇ Télécharger le clip (.ts)</button>
    <button data-act="csv" id="cm-csv">⬇ Positions KLV (.csv)</button>
    <button data-act="del" class="danger">✕ Supprimer</button>
  </div>
  <main id="op-main">
    <div id="map">
      <div class="map-ctl">
        <label class="chk" title="cadrage automatique de la carte">suivre <select id="follow" style="padding:1px 4px"><option value="none" selected>Désactivé</option><option value="sensor">le capteur</option><option value="center">le centre image</option><option value="both">capteur + empreinte</option></select></label>
        <div style="display:flex;gap:4px"><button id="btn-fit" style="padding:2px 8px;flex:1">Ajuster la vue</button></div>
        <div style="display:flex;gap:4px"><button id="btn-measure" style="padding:2px 8px;flex:1" title="mesurer : cliquer les points, double-clic ou Échap pour terminer">📏 Mesurer</button><button id="btn-measure-clear" style="padding:2px 8px" title="effacer les mesures">✕</button></div>
        <div style="display:flex;gap:4px"><button id="btn-settings" style="padding:2px 8px;flex:1" title="source du fond de carte (réglage partagé avec la console, enregistré dans basemap.json)">🗺 Fond de carte</button></div>
      </div>
      <div class="coords" id="coords" title="position du pointeur — cliquer pour copier le MGRS"><b id="c-mgrs">—</b><span id="c-ll"></span></div>
      <div class="legend" title="cliquer une entrée pour masquer / afficher la couche">
        <span data-ly="trace"><i style="background:#00c8ff"></i>plateforme / trace</span>
        <span data-ly="foot"><i style="background:#ffd54f"></i>empreinte</span>
        <span data-ly="center"><i style="background:#ff5252"></i>centre image</span>
        <span data-ly="plots"><i style="background:#7cff6b;border-radius:0"></i>plots GMTI</span>
        <span data-ly="dwell"><i style="background:transparent;border:1px solid #7cff6b;border-radius:0"></i>dwell</span>
        <span data-ly="live"><i style="background:#00e5a8;border-radius:50%;width:9px;height:9px"></i>pistes GMTI</span>
        <span data-ly="contacts"><i style="background:#e58cff;border-radius:0;height:5px;width:12px;opacity:.7"></i>contacts</span>
        <span data-ly="cot"><i style="background:#ff5252;border-radius:2px;width:8px;height:8px"></i><i style="background:#00c8ff;border-radius:2px;width:8px;height:8px;margin-left:-3px"></i>CoT</span>
        <span data-ly="labels"><i style="background:transparent;border:1px solid #8a8f98;border-radius:2px;width:12px;height:8px"></i>étiquettes</span>
      </div>
    </div>
    <div id="op-gutter" title="glisser pour redimensionner"></div>
    <div id="video-col">
      <video id="video" controls muted playsinline></video>
      <div class="overlay" id="mode-badge">—</div>
      <div class="hud" id="hud"></div>
      <div id="v-cursor" hidden></div>
      <svg id="v-meas" hidden></svg>
      <div id="v-toast" hidden></div>
    </div>
  </main>

  <footer id="op-tl">
    <canvas id="timeline" height="124" title=""></canvas>
    <div id="tl-preview" hidden><canvas width="160" height="90"></canvas><div id="tl-preview-t">—</div></div>
    <div id="tl-info">
      <span>mission UTC <b id="tl-mutc">—</b></span>
      <span>t = <b id="tl-t">0.000</b> / <b id="tl-d">—</b> s</span>
      <span>KLV <b id="tl-utc">—</b></span>
      <span class="grow" id="tl-mode"></span>
      <span id="status" class="muted"></span>
    </div>
  </footer>
</div>

<div class="settings" id="settings" hidden>
  <div class="st-head"><b>🗺 Fond de carte</b><button id="st-close">✕</button></div>
  <div class="st-body">
    <section>
      <div class="row"><label class="chk"><input type="checkbox" id="basemap" checked> afficher le fond de carte</label></div>
      <label>Source <select id="bm-provider">
        <option value="arcgis_online">ArcGIS Online (internet)</option>
        <option value="mapserver">MapServer ArcGIS dynamique — export (réseau local, via proxy)</option>
        <option value="none">Aucun</option></select></label>
      <label id="bm-layer-row">Couche <select id="bm-layer">
        <option value="World_Imagery">Imagerie</option>
        <option value="World_Topo_Map">Topographique</option>
        <option value="World_Street_Map">Rues</option>
        <option value="Canvas/World_Dark_Gray_Base">Gris foncé (canvas)</option></select></label>
      <div id="bm-ms-rows">
        <label>URL MapServer <input id="bm-url" type="text" placeholder="https://serveur/arcgis/rest/services/X/MapServer"></label>
        <label>Token <input id="bm-token" type="text" placeholder="(optionnel)"></label>
        <label class="chk"><input type="checkbox" id="bm-insecure" checked> accepter un certificat auto-signé</label>
      </div>
      <div class="row"><button id="bm-save" class="accent">Appliquer &amp; enregistrer</button><span id="bm-msg" class="muted"></span></div>
      <div class="row"><span class="muted">Réglage commun à la console pcap (fichier basemap.json du serveur).</span></div>
    </section>
  </div>
</div>

<!-- Contrat DOM minimal du moteur (valeurs pilotées par l'URL, jamais affichées) -->
<div hidden>
  <input id="pcap" type="text">
  <select id="mode"><option value="play">play</option><option value="emit">emit</option><option value="follow">follow</option></select>
  <select id="source"><option value="file">file</option></select>
  <input id="loop" type="checkbox">
  <input id="gmti-live" type="checkbox" checked>
  <select id="gmti-profile"></select>
</div>

<script src="static/pages.js"></script>
<script src="static/leaflet.js"></script>
<script src="static/mpegts.js"></script>
<script src="static/klv0601.js"></script>
<script src="static/mgrs_lite.js"></script>
<script src="static/app.js"></script>
<script src="static/replay.js"></script>
</body>
</html>
